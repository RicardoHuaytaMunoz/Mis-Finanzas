<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Financiero - Data Model</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Header & Filtros -->
    <header class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-lg">
      <h1 class="text-xl font-bold text-emerald-400"><i class="fa-solid fa-chart-line mr-2"></i>FinOps Tracker</h1>
      <div class="flex gap-4">
        <select id="monthFilter" class="bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-slate-200 focus:ring-emerald-500"></select>
        <select id="categoryFilter" class="bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-slate-200 focus:ring-emerald-500">
          <option value="ALL">Todas las Categorías</option>
          <option value="Educación">Educación</option>
          <option value="Transporte">Transporte</option>
          <option value="Servicios">Servicios</option>
          <option value="Hogar">Hogar</option>
          <option value="Alimentación">Alimentación</option>
        </select>
      </div>
    </header>

    <!-- KPIs y Métricas Core -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4" id="kpiContainer">
      <!-- Generado dinámicamente vía app.js -->
    </div>

    <!-- Insights Generados -->
    <div class="bg-indigo-950/30 border border-indigo-500/20 p-4 rounded-xl">
      <h3 class="text-sm font-bold text-indigo-400 mb-2"><i class="fa-solid fa-lightbulb mr-2"></i>Insights de Optimización</h3>
      <ul id="insightsList" class="text-xs text-slate-300 space-y-1 list-disc list-inside"></ul>
    </div>

    <!-- Visualización de Datos -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 h-96">
      <canvas id="analyticalChart"></canvas>
    </div>

  </div>
  <script src="js/app.js"></script>
</body>
</html>
